name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # Format, lint, type check, unit tests, end-to-end tests in Chromium and WebKit, then the build.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify
      # The build must leave the tree as committed: dist/ ignored except dist/.gitkeep.
      - run: test -f dist/index.html && git diff --exit-code && test -z "$(git status --porcelain)"
  # The Go module: vet and test the placeholder embed (release builds are tested by release.yml).
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -p 4 ./...
      # The release-only version check's pattern; the rest of the release tests need a build.
      - run: go test -p 4 -tags release -run TestReleaseVersionPattern ./...
  # The release machinery that only runs on main, the release PR or a release, checked here
  # first: beta.yml's numbering, release-please's config and release.sh's guards.
  release-config:
    runs-on: ubuntu-latest
    steps:
      # Every commit, so release_test.sh can tag HEAD~1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The script beta.yml numbers each beta with.
      - name: Check the beta numbering
        run: sh .github/scripts/beta-version_test.sh
      # release.yml, beta.yml and the Go module rely on these: a release tagged build/vX.Y.Z,
      # a manifest holding the one package ".", and beta.yml on release-please's branch for the
      # component "build".
      - name: Check the release-please config
        run: |
          set -eu
          jq -e '.packages | keys == ["."]' release-please-config.json
          jq -e '.packages["."] | .["release-type"] == "node" and .component == "build"
            and .["include-component-in-tag"] == true and .["tag-separator"] == "/"' release-please-config.json
          jq -e 'keys == ["."] and (.["."] | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' .release-please-manifest.json
          branch="release-please--branches--main--components--$(jq -r '.packages["."].component' release-please-config.json)"
          if ! grep -qxF "    branches: [$branch]" .github/workflows/beta.yml \
            || ! grep -qxF "      BRANCH: $branch" .github/workflows/beta.yml; then
            echo "::error::beta.yml must run on $branch (on.push.branches and env.BRANCH)"
            exit 1
          fi
      # release.sh's guards, in a throwaway clone; every case is refused before a build.
      - name: Check release.sh's guards
        env:
          RELEASE_TEST_DIR: ${{ runner.temp }}
        run: scripts/release_test.sh
